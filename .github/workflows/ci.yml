# Checks every push and pull request on Linux and macOS.
# No secrets are used: tests talk only to a fake server on 127.0.0.1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      # Pinned to commits: a moved tag can't swap the code that runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The oldest Node dimosi supports (engines: >=22.12).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The built extension in a real VS Code (downloaded here), with the fake model server.
      # Linux runners have no screen: xvfb gives VS Code a virtual one.
      - name: Real VS Code
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:vscode' || 'npm run test:vscode' }}
